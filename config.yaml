# jobwatch config
interval_seconds: 90

# Independent daemon cadences. A source can override these with its own
# `interval_seconds`. One-shot mode still polls every configured source once.
poll_intervals:
  direct_api: 60
  workday: 120
  custom: 120
  browser: 180
  fallback: 900
initial_spread_seconds: 30

# Drop postings older than this, in days. Two escape hatches:
#  - a posting whose date can't be read ALWAYS passes
#  - a title naming the 2027 cycle NEVER expires (see max_age_exempt below)
# Lower it if you see stale roles; raise it if the list feels thin.
max_age_days: 90

# Companies to drop entirely, whatever the role. Add a name here once you know
# it's noise for you — every entry is an alert you won't have to ignore.
never_alert_companies:
  - TikTok
  - ByteDance

# Titles matching these ignore max_age_days entirely. A "Summer 2027
# Internship" posted 4 months ago is still the exact role you're racing for.
max_age_exempt_if_title_matches:
  - '\b2027\b'
  - 'summer 2027|fall 2026|spring 2027'
concurrency: 12

filters:
  # ---- GATE 1: is it a software role?  (matched against the TITLE)
  role_must_match_any:
    - 'software (engineer|engr\b|developer|development|dev\b)'
    - '\bapplication (engineer|development)\b'
    - '\b(swe|sde)\b'
    - '(front.?end|back.?end|full.?stack|web) (engineer|developer)'
    - '(mobile|ios|android) (engineer|developer)'
    - '(embedded software|software (platform|infrastructure|systems)) engineer'
    - '(quantitative|quant) (developer|software (engineer|developer))'
    - 'software engineering (intern|internship|co.?op)'

  # ---- GATE 2: is it early-career?  (matched against the TITLE)
  level_must_match_any:
    - 'intern\b|internship|\bco.?op\b'
    - 'new ?grad|newgrad|university|campus|early career|new college'
    - 'entry.level|junior|\bgrad(uate)?\b|\bassociate\b'
    - 'engineer,? (i|1)\b(?!i)'
    - '(class of|summer|fall|spring|start(ing)?)\s*(2026|2027)'
    - '\brotational\b|\bapprentice'

  internship_signal_any:
    - '\bintern\b|internship|\bco.?op\b'

  new_grad_signal_any:
    - 'new ?grad|newgrad|university grad|\bcampus\b|early career|new college'
    - '\bentry(?:.?level)?\b|junior|\bassociate\b|recent grad|\bgraduate\b|\bapprentice\b|\brotational\b'
    - '(software engineer|software engr|software developer|swe|sde),?\s*(i|1)\b(?!i)'
    - '(class of|start(ing)?)\s*(2026|2027)'

  # Used only when an adapter returns the job description. These allow a
  # generic "Software Engineer" title only when the body proves it is entry-level.
  entry_description_any:
    - 'new grad(uate)?|recent grad(uate)?|university (hire|graduate|recruit)'
    - '(0|zero)\s*(?:-|to)\s*2 years|0\+?\s*years of (professional )?experience'
    - 'no (prior|professional) experience (is )?required'
    - 'graduat(e|ing|ion).{0,80}(2026|2027)'

  experienced_description_any:
    # A generic Software Engineer title passes by default. These are explicit
    # reasons to disqualify it from the new-grad dashboard. Ranges beginning
    # at 0 or 1 (for example 0-4 years) are protected in classify_target().
    - '\b(2|[3-9]|[1-9][0-9])\+?\s*years? of (professional |industry |relevant |hands.?on )?(software |engineering )?experience'
    - '\b(minimum(?: of)?|at least|requires?|plus)\s+(2|two|[3-9]|three|four|five|six|seven|eight|nine|[1-9][0-9])\+?\s+years?(?: of)?(?: [a-z-]+){0,4}\s+experience'
    - '\b(2|[3-9]|[1-9][0-9])\+\s*years?(?: of)?(?: [a-z-]+){0,4}\s+(experience|developing|building|working)'
    - '\b(2|two|[3-9]|three|four|five|six|seven|eight|nine|[1-9][0-9])(?:\s*[-–—]\s*\d{1,2}|\+|\s+or more)?\s+years?\b.{0,80}\b(experience|developing|building|working)\b'
    - '\bmid.?level\b|\bsenior.?level\b'
    - '\bthis is (a|an) (senior|staff|principal)(?:,? [a-z-]+){0,4}\s+role\b'
    - '\blooking for experienced (software )?engineers?\b'
    - '\bexperience must (?:include|involve|require).{0,50}\b(?:2|two|3|three|4|four|5|five|6|six|7|seven|8|eight|9|nine|[1-9][0-9])\s*(?:\([2-9][0-9]?\))?\s+years?\b'

  non_full_time_any:
    - '\bpart.?time\b|\bcontract(or)?\b|\btemporary\b|seasonal'

  quant_role_any:
    - '(quantitative|quant) (developer|software (engineer|developer))'

  # ---- GATE 3: kill non-engineering functions  (matched against the TITLE)
  title_exclude_any:
    - '\bsenior\b|\bstaff\b|\bprincipal\b|\bprinicipal\b|\bmanager\b|\bdirector\b|\blead(?:er)?\b|\bleadership\b(?!\s+program)|vice president|\bvp\b|\bsr\.?\b'
    - '\badvanced software (?:engineer|engr|developer)\b'
    - '\bfounding\b|\bmid[ .-]?(career|level)\b|\barchitect\b|\bdistinguished\b|\bfellow\b'
    - '\b(?:engineer|engr|developer)\s*[2-9]\b|\b(?:engineer|engr|developer)\s*(ii|iii|iv|v)\b'
    - '\blevel\s*[2-9]\b|\bspecialist\b|\bsubject matter expert\b|\bsme\b|\bprofessional\b'
    - '\b(swe|sde|sre)\s*([2-9]|ii|iii|iv)\b|\bic\s*[2-9]\b|\bl[2-9]\b'
    - '\bph\.?d\b|\bmba\b'
    - 'product (manager|management|designer|owner|operations)'
    - 'designer|\bux\b|ui/ux'
    - '(finance|financial|treasury|accounting|audit|payroll|tax)\b'
    - 'analyst intern|business analyst|data analyst|financial analyst'
    - 'marketing|social media|communications|public policy|\bbrand\b'
    - 'recruit|talent|people operations|total rewards|human resources'
    - 'sales|account executive|customer (experience|advocacy|success|support)'
    - 'legal|compliance|\bgrc\b|\brisk\b'
    - 'strategy|strategist|venture capital|consultant'
    - 'supply chain|logistics|procurement|facility|warehouse|operations associate'
    - 'manufacturing|industrial|process engineer|technician|occupational|safety'
    - 'physical security|network security engineer|security analyst'
    - 'mechanical|electrical|civil|chemical|naval|aerospace|flight test|materials'
    - 'silicon|\bsoc\b|\bfpga\b|asic|vlsi|hardware|firmware|physical design'
    - 'verification|validation|test engineer|engineer.{0,20}\btest\b|\bqa\b|quality'
    - 'electro.optic|applied physics|photonics|optical'
    - '\btrader\b|trading (assistant|operations)|execution trader'
    - 'quantitative (trader|research)'
    - 'praktikum|premaster|werkstudent|alternance'
    - 'ground systems|\brf\b|structures|mechanisms|mission engineering'
    - 'test and operations|skillbridge|controls engineer'
    - 'skillbridge|military fellow'
    - '\brf\b|ground systems|structures|mechanisms|propulsion|avionics|thermal'
    - 'mission engineer|systems integrat|test (and|&) operations|operations engineer'

  # Some career sites shorten the visible title but leave the true seniority
  # in the official URL (for example /experienced-software-engineer/).
  url_exclude_any:
    - 'external_experienced'
    - '[/_-](experienced|senior|sr\.?|staff|principal|lead|manager|mid-career)[/_?&=-]'

  # ---- GATE 4a: positive US evidence  (matched against TITLE + LOCATION)
  # A posting must look American. Vague locations are dropped on purpose.
  us_signal_any:
    - 'united states|\bu\.?s\.?a?\b|remote.{0,4}(us|usa)'
    - '\b(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|IA|ID|IL|KS|KY|LA|MA|MD|MI|MN|MO|MS|MT|NC|ND|NE|NH|NJ|NM|NV|NY|OH|OK|PA|RI|SC|SD|TN|TX|UT|VA|VT|WA|WI|WV|WY|DC)\b'
    - '(california|texas|washington|new york|massachusetts|illinois|colorado|georgia|florida|virginia|arizona|oregon|utah|minnesota|michigan|ohio|pennsylvania|maryland|carolina|tennessee|missouri|indiana|wisconsin|nevada|hawaii|new jersey|connecticut|new mexico|iowa|kansas|oklahoma|nebraska|arkansas|alabama|kentucky|louisiana|mississippi|idaho|montana|rhode island|delaware|vermont|alaska|wyoming|dakota|west virginia|new hampshire)'
    - '(san francisco|new york|seattle|austin|chicago|boston|denver|atlanta|los angeles|san jose|san diego|palo alto|mountain view|sunnyvale|santa clara|bellevue|redmond|kirkland|menlo park|cupertino|arlington|mclean|reston|pittsburgh|philadelphia|dallas|houston|phoenix|portland|miami|nashville|charlotte|raleigh|durham|boulder|salt lake|minneapolis|detroit|columbus|indianapolis|kansas city|honolulu|costa mesa|irvine|santa monica|culver city|bentonville|westlake|hillsboro|albuquerque|colorado springs|fort collins|overland park|deerfield|woonsocket)'

  # ---- GATE 4b: explicit foreign evidence always loses
  non_us_any:
    - '\b(india|china|japan|korea|singapore|malaysia|vietnam|thailand|philippines|indonesia|taiwan|hong kong|israel|turkey|egypt|nigeria|kenya|south africa)\b'
    - '\b(canada|mexico|brazil|argentina|chile|colombia|costa rica|panama|peru)\b'
    - '\b(united kingdom|england|ireland|scotland|france|germany|spain|italy|portugal|netherlands|belgium|switzerland|austria|sweden|norway|denmark|finland|poland|serbia|romania|hungary|czech|greece|australia|new zealand)\b'
    - '(london|dublin|paris|berlin|munich|stuttgart|hamburg|amsterdam|brussels|madrid|barcelona|milan|lisbon|zurich|geneva|vienna|stockholm|oslo|copenhagen|helsinki|warsaw|prague|budapest|belgrade|bucharest|athens|istanbul|tel aviv|dubai|yokneam)'
    - '(bengaluru|bangalore|hyderabad|mumbai|delhi|gurgaon|chennai|noida|gift city)'
    - '(haifa|herzliya|ramat gan|petah tikva|beer sheva)'
    - '(beijing|shanghai|shenzhen|guangzhou|hangzhou|taipei|seoul|tokyo|yokohama|osaka|sydney|melbourne|auckland)'
    - '(ho.?chi.?minh|hanoi|penang|bayan lepas|kuching|johor|selangor|petaling|sarawak|pasir gudang|kuala lumpur|jakarta|manila|bangkok|bangpa)'
    - '(toronto|vancouver|montreal|ottawa|waterloo|calgary|guadalajara|mexico city|sao paulo|bogota|buenos aires)'
    - '(mechelen|vlaanderen|aveiro|reutlingen|hildesheim|lohr am main)'
    - '\b(BW|NDS|BY|NRW|BLR1|CN)\b'

  # Amazon/Workday put a COUNTRY code first in the location field ("IL, Haifa"
  # is Israel, not Illinois). Anchored to the start of LOCATION only.
  non_us_location_prefix:
    - '^(IL|IN|DE|PL|CN|BR|JP|MX|GB|UK|FR|IE|SG|AU|ZA|EG|LU|NL|ES|IT|SE|RO|CZ|TR|AE|SA|KR|TW|PH|VN|TH|MY|ID|NZ|AT|CH|BE|DK|FI|NO|PT|GR|HU|CR|CO|CL|AR|PE|JO|NG|KE), '

  boost_any:
    - 'Microsoft|Amazon|Google|Apple|Meta|NVIDIA|Databricks|Stripe|Anthropic|OpenAI|Samsara|Palantir'

sources:
  # ================= Own careers APIs (what public trackers miss) ==========
  # ---- Fallback net: SimplifyJobs' GitHub feed -------------------------
  # Covers every company we can't reach directly — Microsoft, Google, Apple,
  # Meta, Oracle, Citadel, and hundreds more. `skip_direct: true` makes it
  # automatically ignore any company already listed above, so the fast direct
  # feed always wins and nothing shows up twice.
  # Refreshes ~hourly, so these land slower than the 90s direct sources.
  - {type: simplify, feed: internships, cohort: internship, skip_direct: true}
  - {type: simplify, feed: newgrad, cohort: newgrad, skip_direct: true}
  - {type: eightfold, company: Microsoft, subdomain: microsoft, domain: microsoft.com, query: software engineer intern}
  - {type: eightfold, company: Microsoft, subdomain: microsoft, domain: microsoft.com, query: software engineer new grad}
  - {type: amazon, company: Amazon, query: software development engineer intern}
  - {type: amazon, company: Amazon, query: software engineer graduate}
  - {type: apple, company: Apple, query: software engineer, interval_seconds: 60}
  - {type: apple, company: Apple, query: early career, interval_seconds: 60}
  - {type: ibm, company: IBM, country: United States, interval_seconds: 60}
  - {type: vanguard, company: Vanguard,
     org_id: companies/fbd5ce04-22d1-4aae-90dc-0282e45ee06f,
     interval_seconds: 60}
  - {type: oracle_hcm, company: Honeywell, host: ibqbjb.fa.ocs.oraclecloud.com,
     site: CX_1, slug: careers.honeywell.com, path_site: Honeywell, title_facet: "124",
     location_facet: "300000000469866", interval_seconds: 60}

