name: jobwatch
on:
  schedule:
    # Offset from :00, when scheduled Actions experience the most congestion.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: jobwatch
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - run: python main.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Persist seen state
        run: |
          git config user.name  "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          git add state.json dashboard.html
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
